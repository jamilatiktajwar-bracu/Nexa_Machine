name: C++ build and tests
on:
  push:
  pull_request:
concurrency:
  group: nexa-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: 'desktop'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || runner.os == 'macOS' && 'clang_64' || 'gcc_64' }}
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DNEXA_BUILD_GUI=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build iOS VM core (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build-ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DNEXA_BUILD_HOST_TOOLS=OFF -DNEXA_BUILD_GUI=OFF -DBUILD_TESTING=OFF && cmake --build build-ios --config Release --parallel
      - name: Build SwiftUI iOS app (macOS)
        if: runner.os == 'macOS'
        run: brew install xcodegen && cd mobile/ios && xcodegen generate && xcodebuild -project NexaMachine.xcodeproj -scheme NexaMachine -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Setup Android NDK (Linux)
        if: runner.os == 'Linux'
        uses: android-actions/setup-android@v3
      - name: Build Android JNI core (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build-android -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID=ON -DNEXA_BUILD_HOST_TOOLS=OFF -DNEXA_BUILD_GUI=OFF -DBUILD_TESTING=OFF && cmake --build build-android --config Release --parallel
      - name: Install Android app build tools (Linux)
        if: runner.os == 'Linux'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Setup Java and Gradle (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle (Linux)
        if: runner.os == 'Linux'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android Compose app (Linux)
        if: runner.os == 'Linux'
        run: gradle -p mobile/android assembleDebug
      - name: Run demo (Unix)
        if: runner.os != 'Windows'
        run: ./build/nexa
      - name: Run demo (Windows)
        if: runner.os == 'Windows'
        run: .\build\Release\nexa.exe
