name: C++ build and tests
on:
  push:
  pull_request:
concurrency:
  group: nexa-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 (Linux)
        if: runner.os == 'Linux'
        run: sudo find /etc/apt/sources.list.d -type f -exec grep -l 'packages.microsoft.com' {} + | xargs -r sudo rm -f; sudo apt-get update; sudo apt-get install -y qt6-base-dev
      - name: Install Qt6 (macOS)
        if: runner.os == 'macOS'
        run: brew install qt
      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install qtbase:x64-windows
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DBUILD_TESTING=ON -DNEXA_BUILD_GUI=ON -DNEXA_REQUIRE_GUI=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DBUILD_TESTING=ON -DNEXA_BUILD_GUI=ON -DNEXA_REQUIRE_GUI=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DBUILD_TESTING=ON -DNEXA_BUILD_GUI=ON -DNEXA_REQUIRE_GUI=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install staging smoke
        run: cmake --install build --config Release --prefix install-root
      - name: Verify staged installation
        shell: bash
        run: |
          test -x install-root/bin/nexa || test -f install-root/bin/nexa.exe
          test -f install-root/bin/nexa_gui || test -f install-root/bin/nexa_gui.exe
      - name: Package
        run: cpack --config build/CPackConfig.cmake -B release
      - name: Verify Unix package archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pkg="$(find release -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$pkg"
          tar -tzf "$pkg" | grep -E '(^|/)bin/nexa_gui$'
          tar -tzf "$pkg" | grep -E '(^|/)bin/nexa$'
      - name: Verify Windows package archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = Get-ChildItem release -Filter *.zip | Select-Object -First 1
          if (-not $pkg) { throw 'ZIP package not found' }
          $items = tar -tf $pkg.FullName
          if (-not ($items | Select-String 'bin/nexa_gui.exe')) { throw 'GUI executable missing' }
          if (-not ($items | Select-String 'bin/nexa.exe')) { throw 'CLI executable missing' }
      - name: Generate release metadata (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pkg=$(find release -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          sha256sum "$pkg" > release/SHA256SUMS
          printf 'NexaMachine\\nVersion: %s\\nCommit: %s\\nPlatform: %s\\n' '${{ github.ref_name }}' '${{ github.sha }}' '${{ runner.os }}' > release/BUILDINFO.txt
      - name: Generate release metadata (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = Get-ChildItem release -Filter *.zip | Select-Object -First 1
          (Get-FileHash $pkg.FullName -Algorithm SHA256).Hash + '  ' + $pkg.Name | Out-File release/SHA256SUMS -Encoding ascii
          "NexaMachine`nCommit: ${{ github.sha }}`nPlatform: Windows" | Out-File release/BUILDINFO.txt -Encoding utf8
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nexa-desktop-${{ runner.os }}
          path: release/*
      - name: CLI install smoke (Unix)
        if: runner.os != 'Windows'
        run: ./install-root/bin/nexa
      - name: CLI install smoke (Windows)
        if: runner.os == 'Windows'
        run: .\\install-root\\bin\\nexa.exe
  mobile:
    timeout-minutes: 75
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Android SDK/NDK setup
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'emulator' 'platform-tools' 'system-images;android-35;google_apis;x86_64'
      - name: Build Android native core
        run: cmake -S . -B build-android -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DNEXA_BUILD_HOST_TOOLS=OFF -DNEXA_BUILD_GUI=OFF -DBUILD_TESTING=OFF && cmake --build build-android --config Release --parallel
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /tmp && echo /tmp/gradle-8.9/bin >> "$GITHUB_PATH"
      - name: Android build and emulator tests
        run: gradle -p mobile/android assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          cores: 2
          ram-size: 2048
          heap-size: 512
          disable-animations: true
          script: gradle -p mobile/android connectedDebugAndroidTest

  ios-simulator:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iOS VM core
        run: cmake -S . -B build-ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DNEXA_BUILD_HOST_TOOLS=OFF -DNEXA_BUILD_GUI=OFF -DBUILD_TESTING=OFF && cmake --build build-ios --config Release --parallel
      - name: Build SwiftUI simulator app
        run: cd mobile/ios && xcodegen generate && xcodebuild -project NexaMachine.xcodeproj -scheme NexaMachine -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios-app -configuration Debug CODE_SIGNING_ALLOWED=NO build && ditto -c -k --sequesterRsrc --keepParent build-ios-app/Build/Products/Debug-iphonesimulator/NexaMachine.app nexa-ios-simulator.zip
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: nexa-ios-simulator
          path: mobile/ios/nexa-ios-simulator.zip
