name: C++ build and tests
on:
  push:
  pull_request:
concurrency:
  group: nexa-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 (Linux desktop test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DNEXA_BUILD_GUI=${{ runner.os == 'Linux' }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build iOS VM core (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build-ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DNEXA_BUILD_HOST_TOOLS=OFF -DNEXA_BUILD_GUI=OFF -DBUILD_TESTING=OFF && cmake --build build-ios --config Release --parallel
      - name: Run demo (Unix)
        if: runner.os != 'Windows'
        run: ./build/nexa
      - name: Run demo (Windows)
        if: runner.os == 'Windows'
        run: .\build\Release\nexa.exe
