name: C++ build and tests
on:
  push:
  pull_request:
concurrency:
  group: nexa-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - name: Install Qt6 (macOS)
        if: runner.os == 'macOS'
        run: brew install qt
      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install qtbase:x64-windows
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DBUILD_TESTING=ON -DNEXA_BUILD_GUI=ON -DNEXA_REQUIRE_GUI=ON
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DBUILD_TESTING=ON -DNEXA_BUILD_GUI=ON -DNEXA_REQUIRE_GUI=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DBUILD_TESTING=ON -DNEXA_BUILD_GUI=ON -DNEXA_REQUIRE_GUI=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build iOS VM core (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build-ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DNEXA_BUILD_HOST_TOOLS=OFF -DNEXA_BUILD_GUI=OFF -DBUILD_TESTING=OFF && cmake --build build-ios --config Release --parallel
      - name: Build SwiftUI iOS app (macOS)
        if: runner.os == 'macOS'
        run: brew install xcodegen && cd mobile/ios && xcodegen generate && xcodebuild -project NexaMachine.xcodeproj -scheme NexaMachine -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Setup Android NDK (Linux)
        if: runner.os == 'Linux'
        uses: android-actions/setup-android@v3
      - name: Build Android JNI core (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build-android -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID=ON -DNEXA_BUILD_HOST_TOOLS=OFF -DNEXA_BUILD_GUI=OFF -DBUILD_TESTING=OFF && cmake --build build-android --config Release --parallel
      - name: Install Android app build tools (Linux)
        if: runner.os == 'Linux'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Setup Java (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle (Linux)
        if: runner.os == 'Linux'
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip" && unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP" && echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build Android Compose app (Linux)
        if: runner.os == 'Linux'
        run: gradle -p mobile/android assembleDebug
      - name: Run demo (Unix)
        if: runner.os != 'Windows'
        run: ./build/nexa
      - name: Run demo (Windows)
        if: runner.os == 'Windows'
        run: .\\build\\Release\\nexa.exe
