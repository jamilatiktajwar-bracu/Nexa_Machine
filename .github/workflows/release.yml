name: Nexa release packaging
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write
concurrency:
  group: nexa-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    name: Desktop release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d | xargs -r sudo rm -f && sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.1'
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install openssl:x64-windows
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXA_BUILD_GUI=ON -DNEXA_REQUIRE_GUI=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXA_BUILD_GUI=ON -DNEXA_REQUIRE_GUI=ON -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXA_BUILD_GUI=ON -DNEXA_REQUIRE_GUI=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build and package
        run: cmake --build build --config Release --parallel && cpack --config build/CPackConfig.cmake -B release
      - name: Generate and verify desktop checksums
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            (cd release && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | while IFS= read -r -d '' file; do shasum -a 256 "$file"; done) > .nexa-SHA256SUMS.tmp
            mv .nexa-SHA256SUMS.tmp release/SHA256SUMS
            (cd release && shasum -a 256 -c SHA256SUMS)
          else
            (cd release && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > .nexa-SHA256SUMS.tmp
            mv .nexa-SHA256SUMS.tmp release/SHA256SUMS
            (cd release && sha256sum -c SHA256SUMS)
          fi
      - name: Verify desktop release archive layout (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pkg="$(find release -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$pkg"
          archive_listing="$(tar -tzf "$pkg")"
          if [ "$RUNNER_OS" = "macOS" ]; then
            printf '%s\n' "$archive_listing" | grep -E '(^|/)bin/nexa_gui[.]app/Contents/MacOS/nexa_gui$'
            printf '%s\n' "$archive_listing" | grep -E 'nexa_gui[.]app/Contents/Frameworks/QtWidgets[.]framework/'
            printf '%s\n' "$archive_listing" | grep -E 'nexa_gui[.]app/Contents/PlugIns/platforms/libqcocoa[.]dylib$'
            printf '%s\n' "$archive_listing" | grep -E '(^|/)lib/libcrypto[^/]*[.]dylib$'
          else
            printf '%s\n' "$archive_listing" | grep -E '(^|/)bin/nexa_gui$'
          fi
          printf '%s\n' "$archive_listing" | grep -E '(^|/)bin/nexa$'
      - name: Verify desktop release archive layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem release -Filter *.zip | Select-Object -First 1
          if (-not $package) { throw 'Desktop release ZIP not found' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entries = $archive.Entries | ForEach-Object { $_.FullName }
            if (-not ($entries | Where-Object { $_ -match '(^|/)bin/nexa\\.exe$' })) { throw 'CLI executable missing from ZIP' }
            if (-not ($entries | Where-Object { $_ -match '(^|/)bin/nexa_gui\\.exe$' })) { throw 'GUI executable missing from ZIP' }
            if (-not ($entries | Where-Object { $_ -match 'libcrypto.*\\.dll$' })) { throw 'OpenSSL runtime DLL missing from ZIP' }
          } finally {
            $archive.Dispose()
          }
      - name: Extract and execute packaged release CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pkg="$(find release -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          mkdir -p release-install
          tar -xzf "$pkg" -C release-install
          cli="$(find release-install -type f -path '*/bin/nexa' -print -quit)"
          test -x "$cli"
          export NEXA_HOME="$RUNNER_TEMP/nexa-release-smoke"
          "$cli" --profile-create release-smoke 256 1024
          source_file="$RUNNER_TEMP/nexa-release-smoke.asm"
          executable_file="$RUNNER_TEMP/nexa-release-smoke.nexa"
          printf 'LOAD A, 7\nLOAD B, 8\nADD A, B\nHALT\n' > "$source_file"
          "$cli" --compile "$source_file" "$executable_file"
          output="$("$cli" --exe "$executable_file")"
          printf '%s\n' "$output" | grep -F 'Executable halted.'
          "$cli" --profile-delete release-smoke
          if [ "$RUNNER_OS" = "macOS" ]; then
            (cd release && shasum -a 256 -c SHA256SUMS)
          else
            (cd release && sha256sum -c SHA256SUMS)
          fi
      - name: Extract and execute packaged release CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem release -Filter *.zip | Select-Object -First 1
          if (-not $package) { throw 'Desktop release ZIP not found' }
          Expand-Archive -LiteralPath $package.FullName -DestinationPath release-install -Force
          $cli = Get-ChildItem release-install -Filter nexa.exe -Recurse | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          if (-not $cli) { throw 'Packaged CLI executable not found' }
          $env:NEXA_HOME = Join-Path $env:RUNNER_TEMP 'nexa-release-smoke'
          & $cli.FullName --profile-create release-smoke 256 1024
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI profile creation failed' }
          $sourceFile = Join-Path $env:RUNNER_TEMP 'nexa-release-smoke.asm'
          $executableFile = Join-Path $env:RUNNER_TEMP 'nexa-release-smoke.nexa'
          @('LOAD A, 7', 'LOAD B, 8', 'ADD A, B', 'HALT') | Set-Content -LiteralPath $sourceFile -Encoding ascii
          & $cli.FullName --compile $sourceFile $executableFile
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI compile failed' }
          $output = & $cli.FullName --exe $executableFile
          if ($LASTEXITCODE -ne 0 -or ($output -notlike '*Executable halted.*')) { throw 'Packaged VM execution failed' }
          & $cli.FullName --profile-delete release-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI profile cleanup failed' }
          $checksumLine = Get-Content release/SHA256SUMS | Where-Object { $_ -match '\\.zip$' } | Select-Object -First 1
          if (-not $checksumLine) { throw 'Release ZIP checksum entry missing' }
          $expected = ($checksumLine -split '\\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Release ZIP checksum mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-desktop-${{ runner.os }}
          path: release/*

  android:
    name: Android release
    runs-on: ubuntu-latest
    outputs:
      signing_ready: ${{ steps.android-signing-state.outputs.ready }}
    env:
      NEXA_ANDROID_SIGNING_READY: ${{ secrets.NEXA_ANDROID_KEYSTORE_BASE64 != '' && secrets.NEXA_ANDROID_STORE_PASSWORD != '' && secrets.NEXA_ANDROID_KEY_ALIAS != '' && secrets.NEXA_ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Export Android signing readiness
        id: android-signing-state
        shell: bash
        run: printf 'ready=%s\n' "$NEXA_ANDROID_SIGNING_READY" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK, NDK and emulator setup
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018' 'emulator' 'platform-tools' 'system-images;android-34;default;x86_64'
      - name: Install Gradle
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip && unzip -q gradle.zip -d "$RUNNER_TEMP" && echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Resolve Android release version
        id: android-version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            code=$((10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]}))
          else
            version="2.34.0"
            code=23400
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Configure Android signing
        if: env.NEXA_ANDROID_SIGNING_READY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXA_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXA_ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexa-release.jks"
          echo "NEXA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nexa-release.jks" >> "$GITHUB_ENV"
          echo "NEXA_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXA_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXA_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed Android release
        if: env.NEXA_ANDROID_SIGNING_READY == 'true'
        env:
          NEXA_VERSION_NAME: ${{ steps.android-version.outputs.name }}
          NEXA_VERSION_CODE: ${{ steps.android-version.outputs.code }}
        run: gradle -p mobile/android bundleRelease assembleRelease -PnexaVersionName="$NEXA_VERSION_NAME" -PnexaVersionCode="$NEXA_VERSION_CODE"
      - name: Build unsigned Android preview
        if: env.NEXA_ANDROID_SIGNING_READY != 'true'
        env:
          NEXA_VERSION_NAME: ${{ steps.android-version.outputs.name }}
          NEXA_VERSION_CODE: ${{ steps.android-version.outputs.code }}
        run: gradle -p mobile/android assembleDebug -PnexaVersionName="$NEXA_VERSION_NAME" -PnexaVersionCode="$NEXA_VERSION_CODE"
      - name: Android release APK install and force-stop smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 34
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -accel off
          emulator-boot-timeout: 900
          cores: 4
          ram-size: 4096
          heap-size: 512
          disable-animations: true
          script: bash ci/android-emulator.sh release-smoke
      - name: Verify signed Android outputs and checksums
        if: env.NEXA_ANDROID_SIGNING_READY == 'true'
        shell: bash
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          AAB=$(find mobile/android/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -n "$APK" && test -n "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -verbose -certs "$AAB"
          mkdir -p release-checksums
          sha256sum "$APK" "$AAB" > release-checksums/SHA256SUMS
          sha256sum -c release-checksums/SHA256SUMS
      - name: Verify preview APK and checksum
        if: env.NEXA_ANDROID_SIGNING_READY != 'true'
        shell: bash
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          sha256sum -c "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-android-release
          path: |
            release-checksums/*
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error

  ios:
    name: iOS release
    runs-on: macos-latest
    outputs:
      signing_ready: ${{ steps.ios-signing-state.outputs.ready }}
    env:
      NEXA_IOS_SIGNING_READY: ${{ secrets.NEXA_IOS_DISTRIBUTION_CERTIFICATE_BASE64 != '' && secrets.NEXA_IOS_CERTIFICATE_PASSWORD != '' && secrets.NEXA_IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.NEXA_IOS_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Export iOS signing readiness
        id: ios-signing-state
        shell: bash
        run: printf 'ready=%s\n' "$NEXA_IOS_SIGNING_READY" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Resolve iOS release version
        id: ios-version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            code=$((10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]}))
          else
            version="2.34.0"
            code=23400
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Build signed iOS archive
        if: env.NEXA_IOS_SIGNING_READY == 'true'
        env:
          NEXA_IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.NEXA_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          NEXA_IOS_CERTIFICATE_PASSWORD: ${{ secrets.NEXA_IOS_CERTIFICATE_PASSWORD }}
          NEXA_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.NEXA_IOS_PROVISIONING_PROFILE_BASE64 }}
          NEXA_IOS_TEAM_ID: ${{ secrets.NEXA_IOS_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/nexa-signing.keychain-db"
          security create-keychain -p "$RUNNER_TEMP/keychain-pass" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP/keychain-pass" "$KEYCHAIN"
          echo "$NEXA_IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$NEXA_IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP/keychain-pass" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          echo "$NEXA_IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_NAME.mobileprovision"
          cd mobile/ios
          xcodebuild -project NexaMachine.xcodeproj -scheme NexaMachine -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NexaMachine.xcarchive" DEVELOPMENT_TEAM="$NEXA_IOS_TEAM_ID" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" MARKETING_VERSION="${{ steps.ios-version.outputs.name }}" CURRENT_PROJECT_VERSION="${{ steps.ios-version.outputs.code }}" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>$NEXA_IOS_TEAM_ID</string><key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>org.nexa.machine</key><string>$PROFILE_NAME</string></dict></dict></plist>
          EOF
          APP="$RUNNER_TEMP/NexaMachine.xcarchive/Products/Applications/NexaMachine.app"
          codesign --verify --deep --strict "$APP"
          SIGNATURE_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          printf '%s\n' "$SIGNATURE_INFO" | grep -F "TeamIdentifier=$NEXA_IOS_TEAM_ID"
          EMBEDDED_PROFILE="$APP/embedded.mobileprovision"
          test -f "$EMBEDDED_PROFILE"
          security cms -D -i "$EMBEDDED_PROFILE" > "$RUNNER_TEMP/embedded-profile.plist"
          EMBEDDED_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/embedded-profile.plist")
          test "$EMBEDDED_TEAM" = "$NEXA_IOS_TEAM_ID"
          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/embedded-profile.plist")
          test "$GET_TASK_ALLOW" = false
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NexaMachine.xcarchive" -exportPath "$RUNNER_TEMP/ios-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ios-export" nexa-ios-appstore.zip
          shasum -a 256 nexa-ios-appstore.zip > nexa-ios-appstore.zip.sha256
          shasum -a 256 -c nexa-ios-appstore.zip.sha256
      - name: Build iOS Simulator preview
        if: env.NEXA_IOS_SIGNING_READY != 'true'
        env:
          NEXA_VERSION_NAME: ${{ steps.ios-version.outputs.name }}
          NEXA_VERSION_CODE: ${{ steps.ios-version.outputs.code }}
        run: cd mobile/ios && xcodebuild -project NexaMachine.xcodeproj -scheme NexaMachine -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios-preview MARKETING_VERSION="$NEXA_VERSION_NAME" CURRENT_PROJECT_VERSION="$NEXA_VERSION_CODE" CODE_SIGNING_ALLOWED=NO build && ditto -c -k --sequesterRsrc --keepParent build-ios-preview/Build/Products/Debug-iphonesimulator/NexaMachine.app nexa-ios-simulator.zip && shasum -a 256 nexa-ios-simulator.zip > nexa-ios-simulator.zip.sha256 && shasum -a 256 -c nexa-ios-simulator.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-ios-release
          path: |
            mobile/ios/nexa-ios-appstore.zip*
            mobile/ios/nexa-ios-simulator.zip*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/') && needs.android.outputs.signing_ready == 'true' && needs.ios.outputs.signing_ready == 'true'
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
