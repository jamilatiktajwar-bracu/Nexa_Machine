name: Nexa release packaging
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write
concurrency:
  group: nexa-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    name: Desktop release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d | xargs -r sudo rm -f && sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install qtbase:x64-windows
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXA_BUILD_GUI=ON -DNEXA_REQUIRE_GUI=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXA_BUILD_GUI=ON -DNEXA_REQUIRE_GUI=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXA_BUILD_GUI=ON -DNEXA_REQUIRE_GUI=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build and package
        run: cmake --build build --config Release --parallel && cpack --config build/CPackConfig.cmake -B release
      - name: Generate and verify desktop checksums
        shell: bash
        run: |
          find release -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > .nexa-SHA256SUMS.tmp
          mv .nexa-SHA256SUMS.tmp release/SHA256SUMS
          sha256sum -c release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-desktop-${{ runner.os }}
          path: release/*

  android:
    name: Android release
    runs-on: ubuntu-latest
    outputs:
      signing_ready: ${{ steps.android-signing-state.outputs.ready }}
    env:
      NEXA_ANDROID_SIGNING_READY: ${{ secrets.NEXA_ANDROID_KEYSTORE_BASE64 != '' && secrets.NEXA_ANDROID_STORE_PASSWORD != '' && secrets.NEXA_ANDROID_KEY_ALIAS != '' && secrets.NEXA_ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Export Android signing readiness
        id: android-signing-state
        shell: bash
        run: printf 'ready=%s\n' "$NEXA_ANDROID_SIGNING_READY" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK, NDK and emulator setup
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018' 'emulator' 'platform-tools' 'system-images;android-35;google_apis;x86_64'
      - name: Install Gradle
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip && unzip -q gradle.zip -d "$RUNNER_TEMP" && echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Configure Android signing
        if: env.NEXA_ANDROID_SIGNING_READY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXA_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXA_ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexa-release.jks"
          echo "NEXA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nexa-release.jks" >> "$GITHUB_ENV"
          echo "NEXA_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXA_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXA_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed Android release
        if: env.NEXA_ANDROID_SIGNING_READY == 'true'
        run: gradle -p mobile/android bundleRelease assembleRelease
      - name: Build unsigned Android preview
        if: env.NEXA_ANDROID_SIGNING_READY != 'true'
        run: gradle -p mobile/android assembleDebug
      - name: Android release APK install and force-stop smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          cores: 2
          ram-size: 2048
          heap-size: 512
          disable-animations: true
          script: |
            APK=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
            if [ -z "$APK" ]; then APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk; fi
            adb install "$APK"
            adb shell am start -n com.nexa.machine/.MainActivity
            sleep 8
            adb shell pidof com.nexa.machine
            adb shell am force-stop com.nexa.machine
            adb shell am start -n com.nexa.machine/.MainActivity
            sleep 8
            adb shell pidof com.nexa.machine
      - name: Verify signed Android outputs and checksums
        if: env.NEXA_ANDROID_SIGNING_READY == 'true'
        shell: bash
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          AAB=$(find mobile/android/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -n "$APK" && test -n "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          jarsigner -verify -verbose -certs "$AAB"
          mkdir -p release-checksums
          sha256sum "$APK" "$AAB" > release-checksums/SHA256SUMS
          sha256sum -c release-checksums/SHA256SUMS
      - name: Verify preview APK and checksum
        if: env.NEXA_ANDROID_SIGNING_READY != 'true'
        shell: bash
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
          sha256sum -c "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-android-release
          path: |
            release-checksums/*
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error

  ios:
    name: iOS release
    runs-on: macos-latest
    outputs:
      signing_ready: ${{ steps.ios-signing-state.outputs.ready }}
    env:
      NEXA_IOS_SIGNING_READY: ${{ secrets.NEXA_IOS_DISTRIBUTION_CERTIFICATE_BASE64 != '' && secrets.NEXA_IOS_CERTIFICATE_PASSWORD != '' && secrets.NEXA_IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.NEXA_IOS_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Export iOS signing readiness
        id: ios-signing-state
        shell: bash
        run: printf 'ready=%s\n' "$NEXA_IOS_SIGNING_READY" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Build signed iOS archive
        if: env.NEXA_IOS_SIGNING_READY == 'true'
        env:
          NEXA_IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.NEXA_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          NEXA_IOS_CERTIFICATE_PASSWORD: ${{ secrets.NEXA_IOS_CERTIFICATE_PASSWORD }}
          NEXA_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.NEXA_IOS_PROVISIONING_PROFILE_BASE64 }}
          NEXA_IOS_TEAM_ID: ${{ secrets.NEXA_IOS_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/nexa-signing.keychain-db"
          security create-keychain -p "$RUNNER_TEMP/keychain-pass" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP/keychain-pass" "$KEYCHAIN"
          echo "$NEXA_IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$NEXA_IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP/keychain-pass" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          echo "$NEXA_IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_NAME.mobileprovision"
          cd mobile/ios
          xcodebuild -project NexaMachine.xcodeproj -scheme NexaMachine -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NexaMachine.xcarchive" DEVELOPMENT_TEAM="$NEXA_IOS_TEAM_ID" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>$NEXA_IOS_TEAM_ID</string><key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>org.nexa.machine</key><string>$PROFILE_NAME</string></dict></dict></plist>
          EOF
          codesign --verify --deep --strict "$RUNNER_TEMP/NexaMachine.xcarchive/Products/Applications/NexaMachine.app"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NexaMachine.xcarchive" -exportPath "$RUNNER_TEMP/ios-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ios-export" nexa-ios-appstore.zip
          shasum -a 256 nexa-ios-appstore.zip > nexa-ios-appstore.zip.sha256
          shasum -a 256 -c nexa-ios-appstore.zip.sha256
      - name: Build iOS Simulator preview
        if: env.NEXA_IOS_SIGNING_READY != 'true'
        run: cd mobile/ios && xcodebuild -project NexaMachine.xcodeproj -scheme NexaMachine -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios-preview CODE_SIGNING_ALLOWED=NO build && ditto -c -k --sequesterRsrc --keepParent build-ios-preview/Build/Products/Debug-iphonesimulator/NexaMachine.app nexa-ios-simulator.zip && shasum -a 256 nexa-ios-simulator.zip > nexa-ios-simulator.zip.sha256 && shasum -a 256 -c nexa-ios-simulator.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-ios-release
          path: |
            mobile/ios/nexa-ios-appstore.zip*
            mobile/ios/nexa-ios-simulator.zip*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/') && needs.android.outputs.signing_ready == 'true' && needs.ios.outputs.signing_ready == 'true'
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
